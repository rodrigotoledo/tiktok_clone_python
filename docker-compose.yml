version: '3.8'

services:
  # 🔥 BACKEND FASTAPI
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # 🚀 TEMPO REAL: qualquer mudança na pasta app/ reflete I Mediamente!
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy 
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tiktok_clone_python_development

  # 🐘 POSTGRES
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tiktok_clone_python_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      # Persiste dados fora do container
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 📱 ADMIN (opcional, pra ver os dados)
  admin:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: